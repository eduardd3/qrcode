<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Bin Contents</title>
<style>
  :root{
    --paper:#F4F3EE;--card:#FBFAF6;--ink:#17160F;--ink-soft:#57544A;
    --line:#DEDACE;--pine:#20463A;--kraft:#C7A87C;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;padding:28px 18px 40px;}
  .stage{width:100%;max-width:440px}

  .tag{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 24px 24px;margin-top:14px;box-shadow:0 1px 0 rgba(0,0,0,.02);}
  .tag::before{content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:var(--paper);border:1.5px solid var(--line);}

  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--kraft);text-align:center;margin-top:12px;}
  .bin-id{font-family:var(--mono);font-size:44px;font-weight:600;letter-spacing:.04em;text-align:center;margin:2px 0 2px;text-transform:uppercase;line-height:1.05;}
  .bin-loc{text-align:center;font-family:var(--mono);font-size:13px;color:var(--ink-soft);letter-spacing:.03em;margin-bottom:20px;min-height:16px;}
  ul.items{list-style:none;margin:0;padding:0;border-top:1px dashed var(--line)}
  ul.items li{display:flex;align-items:baseline;gap:12px;padding:13px 4px;border-bottom:1px dashed var(--line);font-size:16px;}
  ul.items li .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--pine);transform:translateY(-2px);}
  .empty-items{padding:22px 4px;color:var(--ink-soft);font-style:italic;border-top:1px dashed var(--line)}

  h1.index-title{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.01em;margin:6px 0 2px;text-align:center;}
  .index-sub{text-align:center;color:var(--ink-soft);font-size:13px;margin:0 0 18px}
  a.bin-link{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 18px;margin-bottom:10px;transition:.15s;}
  a.bin-link:hover{border-color:var(--ink)}
  a.bin-link .bl-id{font-family:var(--mono);font-weight:600;font-size:16px;letter-spacing:.05em}
  a.bin-link .bl-n{font-family:var(--mono);font-size:12px;color:var(--ink-soft)}

  .note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 22px;text-align:center;margin-top:14px;}
  .note .big{font-family:var(--mono);font-size:17px;font-weight:600;margin-bottom:8px}
  .note p{color:var(--ink-soft);font-size:14px;margin:8px 0 0;line-height:1.55;text-align:left}
  .note code{font-family:var(--mono);font-size:12px;background:var(--paper);padding:2px 6px;border-radius:5px;word-break:break-all}
  .note ol{text-align:left;color:var(--ink-soft);font-size:14px;padding-left:20px;margin:10px 0 0}
  .note ol li{margin:6px 0}

  footer{margin-top:22px;text-align:center}
  footer a{font-family:var(--mono);font-size:12px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .refresh{margin-top:14px;text-align:center}
  .refresh button{font-family:var(--mono);font-size:12px;color:var(--ink-soft);background:transparent;border:1px solid var(--line);border-radius:100px;padding:7px 16px;cursor:pointer}
  .refresh button:hover{border-color:var(--ink);color:var(--ink)}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="note"><div class="big">Loading…</div></div>
</div>

<script>
(function(){
  "use strict";


  const SHEET_ID  = "1b2oPvjjan2DZFLrQOktjolVlYqqjzBuNLhtVvBUcsKY";          // <-- paste your sheet ID between the quotes
  const SHEET_TAB = "BINS";      // <-- your tab name

  const stage=document.getElementById("stage");
  const params=new URLSearchParams(location.search);
  const wanted=(params.get("bin")||"").trim().toUpperCase();

  function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

  /* --- minimal, quote-aware CSV parser --- */
  function parseCSV(text){
    text=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
    const rows=[];let row=[];let field="";let inQ=false;
    for(let i=0;i<text.length;i++){
      const ch=text[i];
      if(inQ){
        if(ch==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; }
        else field+=ch;
      }else{
        if(ch==='"')inQ=true;
        else if(ch===','){row.push(field);field="";}
        else if(ch==='\n'){row.push(field);rows.push(row);row=[];field="";}
        else field+=ch;
      }
    }
    row.push(field);rows.push(row);
    return rows.filter(r=>!(r.length===1&&r[0].trim()===""));
  }

  function colIndex(header,names){
    for(const n of names){const i=header.indexOf(n);if(i>=0)return i;}
    return -1;
  }

  /* --- turn sheet rows into grouped bins --- */
  function rowsToBins(csv){
    const rows=parseCSV(csv);
    if(!rows.length)return [];
    const header=rows.shift().map(h=>h.trim().toLowerCase());
    const iBin=colIndex(header,["bin","bin id","binid","id"]);
    const iItem=colIndex(header,["item","items","contents","content"]);
    const iLoc=colIndex(header,["location","loc","where","shelf"]);
    if(iBin<0)return {error:"nobincol"};
    const map=new Map();
    for(const r of rows){
      const id=(r[iBin]||"").trim();if(!id)continue;
      const key=id.toUpperCase();
      if(!map.has(key))map.set(key,{id,loc:"",items:[]});
      const b=map.get(key);
      const loc=iLoc>=0?(r[iLoc]||"").trim():"";
      if(loc&&!b.loc)b.loc=loc;
      const cell=iItem>=0?(r[iItem]||"").trim():"";
      if(cell){
        if(/[\n;]/.test(cell))cell.split(/[\n;]+/).map(s=>s.trim()).filter(Boolean).forEach(x=>b.items.push(x));
        else b.items.push(cell);
      }
    }
    return [...map.values()];
  }

  function renderBin(b){
    const items=(b.items||[]);
    const list=items.length
      ? '<ul class="items">'+items.map(i=>`<li><span class="dot"></span><span>${esc(i)}</span></li>`).join("")+'</ul>'
      : '<div class="empty-items">This bin is empty.</div>';
    stage.innerHTML=`
      <div class="tag">
        <div class="eyebrow">Bin contents</div>
        <div class="bin-id">${esc(b.id)}</div>
        <div class="bin-loc">${b.loc?esc(b.loc):""}</div>
        ${list}
      </div>
      <div class="refresh"><button id="reload">↻ Refresh</button></div>
      <footer><a id="all">See all bins →</a></footer>`;
    document.getElementById("reload").onclick=()=>load();
    document.getElementById("all").onclick=()=>{location.href=location.pathname;};
  }

  function renderIndex(bins){
    const rows=bins.map(b=>{
      const n=(b.items||[]).length;
      return `<a class="bin-link" href="${location.pathname}?bin=${encodeURIComponent(b.id)}">
        <span class="bl-id">${esc(b.id)}</span>
        <span class="bl-n">${n} item${n===1?"":"s"}${b.loc?" · "+esc(b.loc):""}</span></a>`;
    }).join("");
    stage.innerHTML=`
      <h1 class="index-title">All bins</h1>
      <p class="index-sub">${bins.length} tracked · scan a label to jump to one</p>
      ${rows||'<div class="note"><p>No bins in the sheet yet. Add a row with a Bin and an Item.</p></div>'}
      <div class="refresh"><button id="reload">↻ Refresh</button></div>`;
    document.getElementById("reload").onclick=()=>load();
  }

  function renderMissing(){
    stage.innerHTML=`
      <div class="note">
        <div class="big">No bin “${esc(wanted)}” yet</div>
        <p>This label points to a bin that isn't in the sheet. Add a row with <code>${esc(wanted)}</code> in the Bin column, then tap refresh.</p>
      </div>
      <div class="refresh"><button id="reload">↻ Refresh</button></div>
      <footer><a id="all">See all bins →</a></footer>`;
    document.getElementById("reload").onclick=()=>load();
    document.getElementById("all").onclick=()=>{location.href=location.pathname;};
  }

  function renderSetup(){
    stage.innerHTML=`
      <div class="note">
        <div class="big">One-time setup</div>
        <p>This page isn't linked to a sheet yet. Open <code>bin-view.html</code> and set:</p>
        <ol>
          <li>Create a Google Sheet with columns <code>Bin</code>, <code>Location</code>, <code>Item</code> (one row per item).</li>
          <li>Share → Anyone with the link → <b>Viewer</b>.</li>
          <li>Copy the ID from the sheet URL and paste it into <code>SHEET_ID</code> near the top of this file.</li>
          <li>Set <code>SHEET_TAB</code> to your tab name, then redeploy.</li>
        </ol>
      </div>`;
  }

  function renderError(){
    stage.innerHTML=`
      <div class="note">
        <div class="big">Can't reach the sheet</div>
        <p>Check that the sheet is shared as <b>Anyone with the link → Viewer</b>, that <code>SHEET_ID</code> is correct, and that <code>SHEET_TAB</code> matches the tab name exactly.</p>
      </div>
      <div class="refresh"><button id="reload">↻ Try again</button></div>`;
    const rb=document.getElementById("reload");if(rb)rb.onclick=()=>load();
  }

  function load(){
    stage.innerHTML='<div class="note"><div class="big">Loading…</div></div>';
    if(!SHEET_ID){renderSetup();return;}
    const url="https://docs.google.com/spreadsheets/d/"+SHEET_ID+
              "/gviz/tq?tqx=out:csv"+(SHEET_TAB?"&sheet="+encodeURIComponent(SHEET_TAB):"")+
              "&_="+Date.now();
    fetch(url,{cache:"no-store"})
      .then(r=>{if(!r.ok)throw 0;return r.text();})
      .then(csv=>{
        const bins=rowsToBins(csv);
        if(bins&&bins.error){renderError();return;}
        if(!wanted){renderIndex(bins);return;}
        const b=bins.find(x=>String(x.id).toUpperCase()===wanted);
        b?renderBin(b):renderMissing();
      })
      .catch(renderError);
  }

  load();
})();
</script>
</body>
</html>
