<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Bin Contents</title>
<style>
  :root{
    --paper:#F4F3EE;
    --card:#FBFAF6;
    --ink:#17160F;
    --ink-soft:#57544A;
    --line:#DEDACE;
    --pine:#20463A;
    --kraft:#C7A87C;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--paper);color:var(--ink);
    font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;
    padding:28px 18px 40px;
  }
  .stage{width:100%;max-width:440px}

  /* the tag — same identity as the generator */
  .tag{
    position:relative;background:var(--card);
    border:1px solid var(--line);border-radius:18px;
    padding:30px 24px 24px;margin-top:14px;
    box-shadow:0 1px 0 rgba(0,0,0,.02);
  }
  .tag::before{
    content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);
    width:14px;height:14px;border-radius:50%;
    background:var(--paper);border:1.5px solid var(--line);
  }

  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--kraft);text-align:center;margin-top:12px;
  }
  .bin-id{
    font-family:var(--mono);font-size:44px;font-weight:600;letter-spacing:.04em;
    text-align:center;margin:2px 0 2px;text-transform:uppercase;line-height:1.05;
  }
  .bin-loc{
    text-align:center;font-family:var(--mono);font-size:13px;
    color:var(--ink-soft);letter-spacing:.03em;margin-bottom:20px;min-height:16px;
  }
  ul.items{list-style:none;margin:0;padding:0;border-top:1px dashed var(--line)}
  ul.items li{
    display:flex;align-items:baseline;gap:12px;
    padding:13px 4px;border-bottom:1px dashed var(--line);font-size:16px;
  }
  ul.items li .dot{
    flex:none;width:7px;height:7px;border-radius:50%;background:var(--pine);
    transform:translateY(-2px);
  }
  .empty-items{padding:22px 4px;color:var(--ink-soft);font-style:italic;border-top:1px dashed var(--line)}

  .meta{
    text-align:center;font-family:var(--mono);font-size:11px;
    color:var(--ink-soft);margin-top:16px;letter-spacing:.03em;
  }

  /* index view (no ?bin) */
  h1.index-title{
    font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.01em;
    margin:6px 0 2px;text-align:center;
  }
  .index-sub{text-align:center;color:var(--ink-soft);font-size:13px;margin:0 0 18px}
  a.bin-link{
    display:flex;justify-content:space-between;align-items:center;
    text-decoration:none;color:var(--ink);
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:15px 18px;margin-bottom:10px;transition:.15s;
  }
  a.bin-link:hover{border-color:var(--ink)}
  a.bin-link .bl-id{font-family:var(--mono);font-weight:600;font-size:16px;letter-spacing:.05em}
  a.bin-link .bl-n{font-family:var(--mono);font-size:12px;color:var(--ink-soft)}

  /* message states */
  .note{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:26px 22px;text-align:center;margin-top:14px;
  }
  .note .big{font-family:var(--mono);font-size:17px;font-weight:600;margin-bottom:8px}
  .note p{color:var(--ink-soft);font-size:14px;margin:8px 0 0;line-height:1.55}
  .note code{font-family:var(--mono);font-size:12px;background:var(--paper);padding:2px 6px;border-radius:5px}

  footer{margin-top:22px;text-align:center}
  footer a{font-family:var(--mono);font-size:12px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="note"><div class="big">Loading…</div></div>
</div>

<script>
(function(){
  "use strict";
  const stage=document.getElementById("stage");
  const params=new URLSearchParams(location.search);
  const wanted=(params.get("bin")||"").trim().toUpperCase();

  function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

  function renderBin(b){
    const items=(b.items||[]);
    const list=items.length
      ? '<ul class="items">'+items.map(i=>`<li><span class="dot"></span><span>${esc(i)}</span></li>`).join("")+'</ul>'
      : '<div class="empty-items">This bin is empty.</div>';
    stage.innerHTML=`
      <div class="tag">
        <div class="eyebrow">Bin contents</div>
        <div class="bin-id">${esc(b.id)}</div>
        <div class="bin-loc">${b.loc?esc(b.loc):""}</div>
        ${list}
      </div>
      <footer><a href="${location.pathname}">See all bins →</a></footer>`;
  }

  function renderIndex(bins){
    const rows=bins.map(b=>{
      const n=(b.items||[]).length;
      return `<a class="bin-link" href="${location.pathname}?bin=${encodeURIComponent(b.id)}">
        <span class="bl-id">${esc(b.id)}</span>
        <span class="bl-n">${n} item${n===1?"":"s"}${b.loc?" · "+esc(b.loc):""}</span></a>`;
    }).join("");
    stage.innerHTML=`
      <h1 class="index-title">All bins</h1>
      <p class="index-sub">${bins.length} tracked · scan a label to jump straight to one</p>
      ${rows||'<div class="note"><p>No bins in the list yet.</p></div>'}`;
  }

  function renderMissing(){
    stage.innerHTML=`
      <div class="note">
        <div class="big">No bin “${esc(wanted)}” yet</div>
        <p>This label points to a bin that isn't in the current list. If you just added it, re-export <code>bins.json</code> from the tag maker and replace the file here.</p>
      </div>
      <footer><a href="${location.pathname}">See all bins →</a></footer>`;
  }

  function renderError(){
    stage.innerHTML=`
      <div class="note">
        <div class="big">Can't reach the bin list</div>
        <p>This page needs <code>bins.json</code> sitting next to it, served over http (GitHub Pages, Vercel, Netlify, or any host). Opening the file directly with <code>file://</code> won't work — the browser blocks the read.</p>
      </div>`;
  }

  fetch("bins.json",{cache:"no-store"})
    .then(r=>{if(!r.ok)throw 0;return r.json();})
    .then(data=>{
      const bins=Array.isArray(data)?data:(data.bins||[]);
      if(!wanted){renderIndex(bins);return;}
      const b=bins.find(x=>String(x.id).toUpperCase()===wanted);
      b?renderBin(b):renderMissing();
    })
    .catch(renderError);
})();
</script>
</body>
</html>
