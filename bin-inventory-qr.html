<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bin Tags — Inventory QR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.3/qrcode.min.js"></script>
<style>
  :root{
    --paper:#F4F3EE;
    --card:#FBFAF6;
    --ink:#17160F;
    --ink-soft:#57544A;
    --line:#DEDACE;
    --pine:#20463A;
    --pine-soft:#EAF0EC;
    --kraft:#C7A87C;
    --radius:14px;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:32px 24px 80px}

  /* ---- header ---- */
  header.masthead{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:24px;flex-wrap:wrap;
    border-bottom:2px solid var(--ink);
    padding-bottom:16px;margin-bottom:8px;
  }
  .title-block h1{
    font-family:var(--mono);
    font-size:26px;font-weight:600;letter-spacing:-0.02em;
    margin:0;
  }
  .title-block p{margin:4px 0 0;color:var(--ink-soft);font-size:14px;max-width:52ch}
  .count-pill{
    font-family:var(--mono);font-size:12px;letter-spacing:.04em;
    text-transform:uppercase;color:var(--ink-soft);
    border:1px solid var(--line);border-radius:100px;
    padding:6px 12px;background:var(--card);white-space:nowrap;
  }

  /* ---- controls bar ---- */
  .controls{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    margin:20px 0 26px;
  }
  .mode{
    display:inline-flex;background:var(--card);border:1px solid var(--line);
    border-radius:100px;padding:3px;
  }
  .mode button{
    font-family:var(--mono);font-size:12px;letter-spacing:.02em;
    border:0;background:transparent;color:var(--ink-soft);
    padding:7px 14px;border-radius:100px;cursor:pointer;transition:.15s;
  }
  .mode button.on{background:var(--pine);color:#fff}
  .mode-label{font-size:12px;color:var(--ink-soft);font-family:var(--mono)}

  .spacer{flex:1}
  .ghost-btn{
    font-family:var(--mono);font-size:12px;letter-spacing:.02em;
    background:transparent;border:1px solid var(--line);color:var(--ink);
    padding:8px 14px;border-radius:9px;cursor:pointer;transition:.15s;
  }
  .ghost-btn:hover{border-color:var(--ink);background:var(--card)}

  #lookupRow{
    display:none;align-items:center;gap:10px;width:100%;
    margin:-10px 0 22px;
  }
  #lookupRow.show{display:flex}
  #lookupRow label{font-family:var(--mono);font-size:12px;color:var(--ink-soft);white-space:nowrap}
  #lookupBase{
    flex:1;min-width:200px;font-family:var(--mono);font-size:13px;
    border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--card);color:var(--ink);
  }
  #lookupBase:focus{outline:none;border-color:var(--pine)}

  /* ---- editor ---- */
  .editor{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;margin-bottom:34px;
  }
  .editor-grid{display:grid;grid-template-columns:120px 1fr;gap:14px}
  .field label{
    display:block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px;
  }
  .field input,.field textarea{
    width:100%;font-family:var(--sans);font-size:14px;color:var(--ink);
    border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;resize:vertical;
  }
  .field input#binId{font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--pine)}
  .field textarea{min-height:74px;line-height:1.55}
  .field.full{grid-column:1 / -1}
  .editor-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
  .primary-btn{
    font-family:var(--mono);font-size:13px;letter-spacing:.02em;
    background:var(--pine);color:#fff;border:0;border-radius:9px;
    padding:10px 20px;cursor:pointer;transition:.15s;
  }
  .primary-btn:hover{background:#183429}
  .link-btn{background:transparent;border:0;color:var(--ink-soft);font-family:var(--mono);font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

  /* ---- tag grid ---- */
  .tag-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));
    gap:26px 22px;
  }
  .tag{
    position:relative;background:var(--card);
    border:1px solid var(--line);border-radius:12px;
    padding:20px 18px 16px;
    display:flex;flex-direction:column;align-items:center;
    /* notched corners echo a hang-tag */
    box-shadow:0 1px 0 rgba(0,0,0,.02);
  }
  /* punch hole at top */
  .tag::before{
    content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);
    width:12px;height:12px;border-radius:50%;
    background:var(--paper);border:1.5px solid var(--line);
  }
  .tag-id{
    font-family:var(--mono);font-size:17px;font-weight:600;letter-spacing:.06em;
    margin-top:14px;text-transform:uppercase;
  }
  .tag-loc{
    font-family:var(--mono);font-size:11px;color:var(--kraft);
    letter-spacing:.05em;margin-top:2px;min-height:14px;text-transform:uppercase;
  }
  .qbox{
    margin:14px 0 12px;padding:10px;background:#fff;border-radius:8px;border:1px solid var(--line);
    line-height:0;
  }
  .qbox canvas{display:block}
  .tag-items{
    font-size:12px;color:var(--ink-soft);line-height:1.5;
    width:100%;text-align:left;
    border-top:1px dashed var(--line);padding-top:10px;
    max-height:96px;overflow:auto;
  }
  .tag-items div{padding:1px 0}
  .tag-actions{
    display:flex;gap:8px;margin-top:12px;width:100%;
  }
  .tag-actions button{
    flex:1;font-family:var(--mono);font-size:11px;letter-spacing:.02em;
    border:1px solid var(--line);background:transparent;color:var(--ink-soft);
    border-radius:7px;padding:6px 0;cursor:pointer;transition:.15s;
  }
  .tag-actions button:hover{border-color:var(--ink);color:var(--ink)}

  .empty{
    text-align:center;color:var(--ink-soft);padding:60px 20px;
    border:1px dashed var(--line);border-radius:var(--radius);background:var(--card);
  }
  .empty b{color:var(--ink);font-family:var(--mono);font-weight:600}

  .status{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;font-family:var(--mono);font-size:12px;
    padding:9px 16px;border-radius:100px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
  .status.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---- print: label sheet only ---- */
  @media print{
    body{background:#fff}
    .wrap{padding:0;max-width:none}
    header.masthead,.controls,#lookupRow,.editor,.count-pill,.status,.tag-actions{display:none !important}
    .tag-grid{grid-template-columns:repeat(3,1fr);gap:10px}
    .tag{border:1px solid #000;border-radius:8px;break-inside:avoid;box-shadow:none;background:#fff}
    .tag::before{background:#fff}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="title-block">
      <h1>BIN&nbsp;TAGS</h1>
      <p>Label a bin once. Scan to see what's inside without opening it.</p>
    </div>
    <div class="count-pill" id="countPill">0 bins</div>
  </header>

  <div class="controls">
    <span class="mode-label">QR holds:</span>
    <div class="mode" id="modeToggle">
      <button data-mode="contents" class="on">Contents</button>
      <button data-mode="lookup">Lookup link</button>
    </div>
    <div class="spacer"></div>
    <button class="ghost-btn" id="printBtn">Print labels</button>
    <button class="ghost-btn" id="exportBtn">Export</button>
    <button class="ghost-btn" id="importBtn">Import</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>

  <div id="lookupRow">
    <label for="lookupBase">Base URL</label>
    <input id="lookupBase" placeholder="https://yoursite.com/bin  →  scan opens  ?bin=A3">
  </div>

  <div class="editor">
    <div class="editor-grid">
      <div class="field">
        <label for="binId">Bin ID</label>
        <input id="binId" placeholder="A3" maxlength="10">
      </div>
      <div class="field">
        <label for="binLoc">Location <span style="text-transform:none;color:var(--line)">— optional</span></label>
        <input id="binLoc" placeholder="Shelf 2, garage">
      </div>
      <div class="field full">
        <label for="binItems">Contents <span style="text-transform:none;color:var(--line)">— one per line</span></label>
        <textarea id="binItems" placeholder="12× lavender candle 4oz&#10;8× canvas tote&#10;devotional prints — St. Jude"></textarea>
      </div>
    </div>
    <div class="editor-foot">
      <button class="link-btn" id="cancelEdit" style="display:none">cancel edit</button>
      <button class="primary-btn" id="saveBtn">Add bin</button>
    </div>
  </div>

  <div id="tagGrid" class="tag-grid"></div>
</div>

<div class="status" id="status"></div>

<script>
(function(){
  "use strict";
  const KEY="bins.v1";
  let bins=[];
  let mode="contents";
  let lookupBase="";
  let editingId=null;

  const $=s=>document.querySelector(s);
  const grid=$("#tagGrid"), countPill=$("#countPill"),
        idIn=$("#binId"), locIn=$("#binLoc"), itemsIn=$("#binItems"),
        saveBtn=$("#saveBtn"), cancelBtn=$("#cancelEdit"),
        lookupRow=$("#lookupRow"), lookupInput=$("#lookupBase"),
        statusEl=$("#status");

  function toast(msg){
    statusEl.textContent=msg;statusEl.classList.add("show");
    clearTimeout(toast._t);toast._t=setTimeout(()=>statusEl.classList.remove("show"),1800);
  }

  /* ---------- persistence (survives across sessions) ---------- */
  async function load(){
    try{
      const r=await window.storage.get(KEY,false);
      if(r&&r.value){const p=JSON.parse(r.value);bins=p.bins||[];mode=p.mode||"contents";lookupBase=p.lookupBase||"";}
    }catch(e){/* first run / empty key */}
    if(!bins.length){
      bins=[{id:"A3",loc:"Shelf 2",items:["12× lavender candle 4oz","8× canvas tote","devotional prints — St. Jude"]}];
    }
  }
  async function save(){
    try{
      await window.storage.set(KEY,JSON.stringify({bins,mode,lookupBase}),false);
    }catch(e){toast("Couldn't save — data kept for this session only");}
  }

  /* ---------- encode what each QR carries ---------- */
  function payloadFor(b){
    if(mode==="lookup"){
      const base=(lookupBase||"").trim();
      return base ? base+(base.includes("?")?"&":"?")+"bin="+encodeURIComponent(b.id) : "bin="+b.id;
    }
    // contents mode: readable plain text the phone just displays
    let head="BIN "+b.id+(b.loc?"  ·  "+b.loc:"");
    let body=(b.items||[]).map(x=>"• "+x).join("\n");
    return head+(body?"\n"+body:"");
  }

  /* ---------- render ---------- */
  function render(){
    grid.innerHTML="";
    countPill.textContent=bins.length+(bins.length===1?" bin":" bins");
    if(!bins.length){
      grid.innerHTML='<div class="empty">No bins yet. Add one above and its <b>scannable tag</b> shows up here.</div>';
      return;
    }
    bins.forEach(b=>{
      const tag=document.createElement("div");tag.className="tag";
      const items=(b.items||[]).map(x=>`<div>${esc(x)}</div>`).join("")||'<div style="color:var(--line)">empty</div>';
      tag.innerHTML=`
        <div class="tag-id">${esc(b.id)}</div>
        <div class="tag-loc">${b.loc?esc(b.loc):""}</div>
        <div class="qbox"></div>
        <div class="tag-items">${items}</div>
        <div class="tag-actions">
          <button data-act="edit">Edit</button>
          <button data-act="del">Delete</button>
        </div>`;
      const canvas=document.createElement("canvas");
      tag.querySelector(".qbox").appendChild(canvas);
      QRCode.toCanvas(canvas,payloadFor(b),{width:150,margin:1,color:{dark:"#17160F",light:"#ffffff"}},err=>{if(err)console.error(err);});
      tag.querySelector('[data-act="edit"]').onclick=()=>startEdit(b.id);
      tag.querySelector('[data-act="del"]').onclick=()=>del(b.id);
      grid.appendChild(tag);
    });
  }
  function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

  /* ---------- add / edit / delete ---------- */
  function readForm(){
    const id=idIn.value.trim().toUpperCase();
    const loc=locIn.value.trim();
    const items=itemsIn.value.split("\n").map(s=>s.trim()).filter(Boolean);
    return {id,loc,items};
  }
  function clearForm(){idIn.value="";locIn.value="";itemsIn.value="";}
  function startEdit(id){
    const b=bins.find(x=>x.id===id);if(!b)return;
    editingId=id;idIn.value=b.id;locIn.value=b.loc||"";itemsIn.value=(b.items||[]).join("\n");
    saveBtn.textContent="Save changes";cancelBtn.style.display="inline";
    idIn.focus();window.scrollTo({top:0,behavior:"smooth"});
  }
  function endEdit(){editingId=null;saveBtn.textContent="Add bin";cancelBtn.style.display="none";clearForm();}

  saveBtn.onclick=async()=>{
    const {id,loc,items}=readForm();
    if(!id){toast("Give the bin an ID");idIn.focus();return;}
    if(editingId){
      const i=bins.findIndex(x=>x.id===editingId);
      if(id!==editingId && bins.some(x=>x.id===id)){toast("That ID already exists");return;}
      bins[i]={id,loc,items};toast("Updated "+id);endEdit();
    }else{
      if(bins.some(x=>x.id===id)){toast("Bin "+id+" already exists");return;}
      bins.push({id,loc,items});toast("Added "+id);clearForm();
    }
    await save();render();
  };
  cancelBtn.onclick=endEdit;

  async function del(id){
    bins=bins.filter(x=>x.id!==id);
    if(editingId===id)endEdit();
    await save();render();toast("Deleted "+id);
  }

  /* ---------- mode toggle ---------- */
  document.querySelectorAll("#modeToggle button").forEach(btn=>{
    btn.onclick=async()=>{
      mode=btn.dataset.mode;
      document.querySelectorAll("#modeToggle button").forEach(b=>b.classList.toggle("on",b===btn));
      lookupRow.classList.toggle("show",mode==="lookup");
      await save();render();
    };
  });
  lookupInput.oninput=async()=>{lookupBase=lookupInput.value;await save();render();};

  /* ---------- print / export / import ---------- */
  $("#printBtn").onclick=()=>window.print();
  $("#exportBtn").onclick=()=>{
    const blob=new Blob([JSON.stringify({bins,mode,lookupBase},null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="bin-inventory.json";a.click();URL.revokeObjectURL(a.href);
    toast("Exported "+bins.length+" bins");
  };
  $("#importBtn").onclick=()=>$("#importFile").click();
  $("#importFile").onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=async()=>{
      try{
        const p=JSON.parse(r.result);
        if(!Array.isArray(p.bins))throw 0;
        bins=p.bins;mode=p.mode||mode;lookupBase=p.lookupBase||lookupBase;
        lookupInput.value=lookupBase;
        document.querySelectorAll("#modeToggle button").forEach(b=>b.classList.toggle("on",b.dataset.mode===mode));
        lookupRow.classList.toggle("show",mode==="lookup");
        await save();render();toast("Imported "+bins.length+" bins");
      }catch(err){toast("That file didn't look like a bin export");}
    };
    r.readAsText(f);e.target.value="";
  };

  /* ---------- go ---------- */
  (async function init(){
    await load();
    lookupInput.value=lookupBase;
    document.querySelectorAll("#modeToggle button").forEach(b=>b.classList.toggle("on",b.dataset.mode===mode));
    lookupRow.classList.toggle("show",mode==="lookup");
    render();
  })();
})();
</script>
</body>
</html>
